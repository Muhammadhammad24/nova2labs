version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tanstack:
        patterns: ["@tanstack/*"]
      radix:
        patterns: ["@radix-ui/*"]
      lint:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
